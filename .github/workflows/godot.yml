name: Godot - testes, Web e Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot-ci
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('tools/godot_version.env', 'tools/install_godot.sh') }}

      - name: Cache do Gradle (APK com o plugin Android)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('addons/nalata_android/export_plugin.gd', 'tools/godot_version.env', 'android/plugin/build.gradle', 'android/plugin/gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Godot e modelos Web/Android
        run: tools/install_godot.sh --templates

      - name: Rodar testes automatizados
        run: tools/run_tests.sh

      - name: Exportar para Web
        run: tools/export_web.sh

      - name: Guardar o jogo Web como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jogo-web
          path: build/web

      - name: Gerar APK de teste (Android)
        run: tools/export_android.sh

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jogo-android
          path: build/android/na-lata-teste.apk
