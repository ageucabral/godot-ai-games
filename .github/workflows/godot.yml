name: Godot - testes e exportação Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot-ci
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('tools/godot_version.env') }}

      - name: Instalar Godot e modelos Web
        run: tools/install_godot.sh --templates

      - name: Rodar testes automatizados
        run: tools/run_tests.sh

      - name: Exportar para Web
        run: tools/export_web.sh

      - name: Guardar o jogo Web como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jogo-web
          path: build/web
